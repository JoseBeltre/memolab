name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  quality:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Crear .env con valores de marcador
        run: |
          echo "NUXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co" >> .env
          echo "NUXT_PUBLIC_SUPABASE_KEY=placeholder" >> .env

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Análisis estático (ESLint)
        run: pnpm lint

      - name: Verificación de tipos (TypeScript)
        run: pnpm typecheck

      - name: Verificación de tipos de las pruebas
        run: pnpm typecheck:tests

      - name: Pruebas unitarias con Jest y reporte de cobertura
        run: pnpm test -- --coverage

      - name: Pruebas de integración de las políticas de seguridad
        run: pnpm test:integracion

      - name: Construir la aplicación
        run: pnpm build

      - name: Publicar el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage
